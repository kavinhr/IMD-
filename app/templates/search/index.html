{% extends "base.html" %}

{% block title %}Search Data{% endblock %}

{% block content %}
<h2><i class="fas fa-search"></i> Search Weather Data</h2>

<div class="card mt-4">
    <div class="card-body">
        <form method="POST" action="{{ url_for('search.results') }}">
            <div class="row mb-4">
                <div class="col-12">
                    <label class="form-label fw-bold d-block">Data Type</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="data_type" id="dt_monthly" value="monthly" checked>
                        <label class="form-check-label" for="dt_monthly">Monthly Aggregates</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="data_type" id="dt_daily" value="daily">
                        <label class="form-check-label" for="dt_daily">Daily Observations</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Stations</label>
                        <select class="form-select" name="station_ids" multiple size="5">
                            {% for station in stations %}
                            <option value="{{ station.station_id }}">
                                {{ station.station_name }}
                            </option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Hold Ctrl to select multiple</small>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Parameters</label>
                        <select class="form-select" name="parameter_ids" multiple size="5">
                            {% for param in parameters %}
                            <option value="{{ param.parameter_id }}">
                                {{ param.parameter_name }}
                            </option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Hold Ctrl to select multiple</small>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label">Year From</label>
                        <select class="form-select" name="year_from">
                            <option value="">All</option>
                            {% for year in years %}
                            <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label">Year To</label>
                        <select class="form-select" name="year_to">
                            <option value="">All</option>
                            {% for year in years %}
                            <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label">Month From</label>
                        <select class="form-select" name="month_from">
                            <option value="">All</option>
                            {% for m in range(1, 13) %}
                            <option value="{{ m }}">{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label">Month To</label>
                        <select class="form-select" name="month_to">
                            <option value="">All</option>
                            {% for m in range(1, 13) %}
                            <option value="{{ m }}">{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-search"></i> Search
            </button>
        </form>
    </div>
</div>
{% endblock %}
